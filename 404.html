    <script>
        const T = {
            it:{title:"Pagina non trovata",h1:"Pagina non trovata",p:"La pagina che cerchi non esiste o è stata spostata. Da qui puoi tornare alle pagine principali di BurgTV.",home:"Home",download:"Scarica",login:"Accedi"},
            en:{title:"Page not found",h1:"Page not found",p:"The page you are looking for does not exist or has been moved. From here you can go back to the main BurgTV pages.",home:"Home",download:"Download",login:"Sign in"},
            de:{title:"Seite nicht gefunden",h1:"Seite nicht gefunden",p:"Die gesuchte Seite gibt es nicht oder sie wurde verschoben. Von hier kommst du zurück zu den wichtigsten Seiten von BurgTV.",home:"Startseite",download:"Download",login:"Anmelden"},
            es:{title:"Página no encontrada",h1:"Página no encontrada",p:"La página que buscas no existe o se ha movido. Desde aquí puedes volver a las páginas principales de BurgTV.",home:"Inicio",download:"Descargar",login:"Iniciar sesión"},
            fr:{title:"Page introuvable",h1:"Page introuvable",p:"La page que vous cherchez n'existe pas ou a été déplacée. D'ici, vous pouvez revenir aux pages principales de BurgTV.",home:"Accueil",download:"Télécharger",login:"Se connecter"},
            pt:{title:"Página não encontrada",h1:"Página não encontrada",p:"A página que você procura não existe ou foi movida. Daqui você pode voltar às páginas principais do BurgTV.",home:"Início",download:"Baixar",login:"Entrar"},
            tr:{title:"Sayfa bulunamadı",h1:"Sayfa bulunamadı",p:"Aradığın sayfa yok ya da taşındı. Buradan BurgTV'nin ana sayfalarına dönebilirsin.",home:"Ana Sayfa",download:"İndir",login:"Giriş yap"},
            nl:{title:"Pagina niet gevonden",h1:"Pagina niet gevonden",p:"De pagina die je zoekt bestaat niet of is verplaatst. Vanaf hier ga je terug naar de belangrijkste pagina's van BurgTV.",home:"Home",download:"Downloaden",login:"Inloggen"},
            pl:{title:"Nie znaleziono strony",h1:"Nie znaleziono strony",p:"Strona, której szukasz, nie istnieje lub została przeniesiona. Stąd wrócisz do głównych stron BurgTV.",home:"Strona główna",download:"Pobierz",login:"Zaloguj się"},
            ru:{title:"Страница не найдена",h1:"Страница не найдена",p:"Страница, которую вы ищете, не существует или была перемещена. Отсюда можно вернуться на основные страницы BurgTV.",home:"Главная",download:"Загрузка",login:"Войти"},
            ar:{title:"الصفحة غير موجودة",h1:"الصفحة غير موجودة",p:"الصفحة التي تبحث عنها غير موجودة أو تم نقلها. من هنا يمكنك العودة إلى صفحات BurgTV الرئيسية.",home:"الرئيسية",download:"تنزيل",login:"تسجيل الدخول"}
        };
        function initLang(){
            const RE=/^(it|en|de|es|fr|pt|tr|nl|pl|ru|ar)$/;
            const m=document.cookie.match(/burgtv_lang=([^;]+)/); if(m&&RE.test(m[1]))return m[1];
            try{const sv=localStorage.getItem('preferredLang')||localStorage.getItem('lang'); if(sv&&RE.test(sv))return sv;}catch(e){}
            const nv=((navigator.languages&&navigator.languages[0])||navigator.language||'').slice(0,2).toLowerCase(); if(RE.test(nv))return nv;
            return 'en';
        }
        function setLang(l){
            if(!T[l])l='en';
            const d=T[l];
            document.documentElement.lang=l; document.documentElement.dir=(l==='ar'?'rtl':'ltr');
            document.title=d.title+' - BurgTV';
            document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.dataset.i18n;if(d[k])e.textContent=d[k];});
            document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
            document.getElementById('lnkHome').href='https://burgtv.com/'+(l==='it'?'':l+'/');
            try{localStorage.setItem('preferredLang',l);}catch(e){}
            const dom=location.hostname.endsWith('.burgtv.com')?'; domain=.burgtv.com':'';
            document.cookie='burgtv_lang='+l+'; max-age=31536000; path=/'+dom+'; SameSite=Lax';
        }
        document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
        setLang(initLang());
    </script>
