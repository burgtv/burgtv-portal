        .message.error{background:rgba(239,68,68,0.10);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}
        .message.success{background:rgba(16,185,129,0.10);border:1px solid rgba(16,185,129,0.3);color:#6ee7b7}

        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="ar">AR</button>
    </div>
    <div class="container">
        <div class="logo-section">
            <img src="assets/logo-240.webp" alt="BurgTV" class="logo-img" width="91" height="48">
            <h1 id="stepTitle">Password dimenticata</h1>
            <p id="stepDesc">Inserisci la tua email per ricevere un codice di verifica.</p>
        </div>

        <div class="steps-indicator" aria-hidden="true">
            <div class="step-dot active" id="dot1"></div>
            <div class="step-dot" id="dot2"></div>
            <div class="step-dot" id="dot3"></div>
        </div>

        <div class="message error" id="errorMessage" role="alert"><span id="errorText"></span></div>
        <div class="message success" id="successMessage" role="status"><span id="successText"></span></div>

        <!-- Step 1: Email -->
        <div class="step active" id="step1">
            <form onsubmit="sendOTP(event)">
                <div class="form-group">
                    <input type="email" id="email" class="form-input" placeholder=" " required autocomplete="email">
                    <label for="email" class="form-label" data-i18n="email">Email</label>
                </div>
                <div class="turnstile-wrapper">
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAACI9QL47xbPexYyL"></div>
                </div>
                <button type="submit" class="btn" id="btn1" data-i18n="sendCode">Invia codice</button>
            </form>
        </div>

        <!-- Step 2: OTP -->
        <div class="step" id="step2">
            <form onsubmit="verifyOTP(event)">
                <div class="form-group">
                    <input type="text" id="otp" class="form-input otp-input" placeholder=" " required maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code">
                    <label for="otp" class="form-label" data-i18n="otpLabel">Codice a 6 cifre</label>
                </div>
                <button type="submit" class="btn" id="btn2" data-i18n="verify">Verifica</button>
            </form>
            <div class="resend-link"><span data-i18n="resendQ">Non hai ricevuto il codice?</span> <button type="button" class="link-btn" onclick="resendOTP()" data-i18n="resendLink">Invia di nuovo</button></div>
        </div>

        <!-- Step 3: New Password -->
        <div class="step" id="step3">
            <form onsubmit="resetPassword(event)">
                <div class="form-group">
                    <input type="password" id="newPassword" class="form-input" placeholder=" " required minlength="8" autocomplete="new-password">
                    <label for="newPassword" class="form-label" data-i18n="newPwd">Nuova password</label>
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPassword" class="form-input" placeholder=" " required minlength="8" autocomplete="new-password">
                    <label for="confirmPassword" class="form-label" data-i18n="confirmPwd">Conferma password</label>
                </div>
                <button type="submit" class="btn" id="btn3" data-i18n="savePwd">Salva password</button>
            </form>
        </div>

        <div class="back-login"><a href="login.html" data-i18n="backToLogin">Torna al login</a></div>
    </div>

          ar: { back:'رجوع', title:'نسيت كلمة المرور', desc1:'أدخل بريدك الإلكتروني لتلقي رمز التحقق.', desc2:'أرسلنا رمزاً مكوناً من 6 أرقام إلى بريدك.', desc3:'اختر كلمة مرور جديدة وآمنة.', title2:'أدخل الرمز', title3:'كلمة المرور الجديدة', email:'البريد الإلكتروني', sendCode:'إرسال الرمز', otpLabel:'رمز من 6 أرقام', verify:'تحقق', resendQ:'لم تستلم الرمز؟', resendLink:'إرسال مرة أخرى', newPwd:'كلمة المرور الجديدة', confirmPwd:'تأكيد كلمة المرور', savePwd:'حفظ كلمة المرور', backToLogin:'العودة إلى تسجيل الدخول', errSend:'تعذّر إرسال الرمز', errConn:'خطأ في الاتصال', resent:'تم إرسال الرمز مرة أخرى.', otpLen:'يجب أن يتكوّن الرمز من 6 أرقام', otpInvalid:'الرمز غير صالح أو منتهي الصلاحية', pwdShort:'يجب أن تتكوّن كلمة المرور من 8 أحرف على الأقل', pwdMatch:'كلمتا المرور غير متطابقتين', pwdOk:'تم تحديث كلمة المرور. جارٍ العودة إلى تسجيل الدخول...', errSave:'تعذّر الحفظ', errVerify:'لم يكتمل التحقق الأمني. انتظر بضع ثوانٍ ثم حاول مرة أخرى.', backAria:'العودة إلى burgtv.com' }
        };
        function _initFpLang(){
          const RE=/^(it|en|de|es|fr|pt|tr|nl|pl|ru|ar)$/;
          const m=document.cookie.match(/burgtv_lang=([^;]+)/);
          if(m && RE.test(m[1])) return m[1];
          const sv=localStorage.getItem('preferredLang')||localStorage.getItem('lang'); if(sv && RE.test(sv)) return sv;
          const nv=((navigator.languages&&navigator.languages[0])||navigator.language||'').slice(0,2).toLowerCase(); if(RE.test(nv)) return nv;
          return 'en';
        }
        let CURRENT_LANG = _initFpLang();
        function applyFpLang(l) {
          if(!FP_DICT[l])l='it';
          CURRENT_LANG = l;
          const d = FP_DICT[l] || FP_DICT.it;
          document.querySelectorAll('[data-i18n]').forEach(e => { const k = e.getAttribute('data-i18n'); if (d[k]) e.textContent = d[k]; });
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
          document.documentElement.lang = l; document.documentElement.dir = (l === "ar" ? "rtl" : "ltr");
          localStorage.setItem('preferredLang', l);
          localStorage.setItem('lang', l);
          const dom = location.hostname.endsWith('.burgtv.com')||location.hostname==='burgtv.com'?'; domain=.burgtv.com':'';
          document.cookie = 'burgtv_lang='+l+'; max-age=31536000; path=/'+dom+'; SameSite=Lax';
          document.title = d.title + ' - BurgTV';
          document.querySelectorAll('[data-i18n-attr]').forEach(e => { const p = e.getAttribute('data-i18n-attr').split(':'); if (d[p[1]]) e.setAttribute(p[0], d[p[1]]); });
          // refresh step text if currently shown
          if (typeof showStep === 'function' && currentStep) showStep(currentStep);
        }
        document.addEventListener('DOMContentLoaded', () => {
          document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => applyFpLang(b.dataset.lang)));
          applyFpLang(CURRENT_LANG);
        });

        const SUPABASE_URL = 'https://api.burgtv.com';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnc3BtcWZkdWFiZm1mc294cW9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ1NTMyMDEsImV4cCI6MjA2MDEyOTIwMX0.1Xj4sa51Wi8U1Ebm4B3DE5JxCR3eTx2TQUxfV0TaA-I';

        let currentStep = 1;
        let userEmail = '';
        let resetToken = '';
        // Turnstile: caricato al primo uso del modulo (assets/js/bv-turnstile.js); ogni invio usa un token nuovo
        function M(k) { const d = FP_DICT[CURRENT_LANG] || FP_DICT.it; return d[k] || FP_DICT.it[k]; }

        function showStep(step) {
            currentStep = step;
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');

            document.querySelectorAll('.step-dot').forEach((d, i) => {
                d.classList.remove('active', 'done');
                if (i + 1 < step) d.classList.add('done');
                if (i + 1 === step) d.classList.add('active');
            });

            const d = FP_DICT[CURRENT_LANG] || FP_DICT.it;
            const titles = [d.title, d.title2, d.title3];
            const descs = [d.desc1, d.desc2, d.desc3];
            document.getElementById('stepTitle').textContent = titles[step - 1];
            document.getElementById('stepDesc').textContent = descs[step - 1];
            hideMessages();
        }

        function showError(msg) {
            document.getElementById('errorMessage').classList.add('show');
            document.getElementById('successMessage').classList.remove('show');
            document.getElementById('errorText').textContent = msg;
        }

        function showSuccess(msg) {
            document.getElementById('successMessage').classList.add('show');
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successText').textContent = msg;
        }

        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            const originalText = btn.dataset.text || btn.textContent;
            if (!btn.dataset.text) btn.dataset.text = originalText;
            btn.innerHTML = loading ? '<span class="spinner"></span>' : originalText;
        }

        async function sendOTP(e) {
            e.preventDefault();
            hideMessages();
            userEmail = document.getElementById('email').value.trim();

            setLoading('btn1', true);

            const turnstileToken = window.BVTS ? await BVTS.token() : null;
            if (!turnstileToken) { showError(M('errVerify')); setLoading('btn1', false); return; }

            try {
                const res = await fetch(`${SUPABASE_URL}/functions/v1/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({ email: userEmail, turnstile_token: turnstileToken, source: 'web' })
                });

                const data = await res.json();

                if (data.success) {
                    showStep(2);
                    setTimeout(() => { const o = document.getElementById('otp'); if (o) o.focus(); }, 50);
                } else if (data.error_code && String(data.error_code).indexOf('turnstile') === 0) {
                    showError(M('errVerify'));
                } else {
                    showError(data.error || M('errSend'));
                }
            } catch (err) {
                showError(M('errConn'));
            }
            if (window.BVTS) BVTS.consume();

            setLoading('btn1', false);
        }

        async function resendOTP() {
            setLoading('btn2', true);
            const turnstileToken = window.BVTS ? await BVTS.token() : null;
            if (!turnstileToken) { showError(M('errVerify')); setLoading('btn2', false); return; }
            try {
                const res = await fetch(`${SUPABASE_URL}/functions/v1/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({ email: userEmail, turnstile_token: turnstileToken, source: 'web' })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) showSuccess(M('resent')); else showError(data.error_code && String(data.error_code).indexOf('turnstile') === 0 ? M('errVerify') : (data.error || M('errSend')));
            } catch (err) {
                showError(M('errSend'));
            }
            if (window.BVTS) BVTS.consume();
            setLoading('btn2', false);
        }

        async function verifyOTP(e) {
            e.preventDefault();
            hideMessages();
            const otp = document.getElementById('otp').value.trim();

            if (otp.length !== 6) {
                showError(M('otpLen'));
                return;
            }

            setLoading('btn2', true);

            try {
                const res = await fetch(`${SUPABASE_URL}/functions/v1/verify-otp`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({ email: userEmail, otp })
                });

                const data = await res.json();

                if (data.success && data.reset_token) {
                    resetToken = data.reset_token;
                    showStep(3);
                } else {
                    showError(data.error || M('otpInvalid'));
                }
            } catch (err) {
                showError(M('errConn'));
            }

            setLoading('btn2', false);
        }

        async function resetPassword(e) {
            e.preventDefault();
            hideMessages();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 8) {
                showError(M('pwdShort'));
                return;
            }

            if (newPassword !== confirmPassword) {
                showError(M('pwdMatch'));
                return;
            }

            setLoading('btn3', true);

            try {
                const res = await fetch(`${SUPABASE_URL}/functions/v1/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({
                        email: userEmail,
                        reset_token: resetToken,
                        new_password: newPassword
                    })
                });

                const data = await res.json();

                if (data.success) {
                    showSuccess(M('pwdOk'));
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showError(data.error || M('errSave'));
                }
            } catch (err) {
                showError(M('errConn'));
            }

            setLoading('btn3', false);
        }
    </script>
