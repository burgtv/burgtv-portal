          ar: { title:'كلمة مرور جديدة', checking:'جارٍ التحقق من الرابط...', desc:'اختر كلمة مرور جديدة لـ {email}.', newPwd:'كلمة المرور الجديدة', confirmPwd:'تأكيد كلمة المرور', show:'إظهار', hide:'إخفاء', save:'حفظ كلمة المرور الجديدة', backToLogin:'العودة إلى تسجيل الدخول', rules:'8 أحرف على الأقل. الأفضل عبارة من ثلاث أو أربع كلمات. تجنّب اسمك وبريدك وكلمات مرور المواقع الأخرى.', invalid:'هذا الرابط غير صالح أو منتهي الصلاحية (صالح 60 دقيقة ولمرة واحدة). اطلب رابطاً جديداً من "نسيت كلمة المرور".', tooShort:'يجب أن تتكوّن كلمة المرور من 8 أحرف على الأقل.', tooLong:'كلمة المرور طويلة جداً (72 حرفاً بسيطاً كحد أقصى).', common:'كلمة المرور هذه شائعة جداً: اختر غيرها.', containsEmail:'يجب ألا تحتوي كلمة المرور على بريدك.', repetitive:'كلمة المرور مكررة جداً.', mismatch:'كلمتا المرور غير متطابقتين.', ok:'تم تحديث كلمة المرور. للأمان تم تسجيل خروجك من كل الأجهزة: سجّل الدخول بكلمة المرور الجديدة.', conn:'خطأ في الاتصال، حاول مرة أخرى.', weak:'ضعيفة', medium:'متوسطة', strong:'قوية', backAria:'العودة إلى burgtv.com' }
        };
        const RE = /^(it|en|de|es|fr|pt|tr|nl|pl|ru|ar)$/;
        function initLang() {
          const m = document.cookie.match(/burgtv_lang=([^;]+)/); if (m && RE.test(m[1])) return m[1];
          try { const sv = localStorage.getItem('preferredLang') || localStorage.getItem('lang'); if (sv && RE.test(sv)) return sv; } catch (e) {}
          const nv = ((navigator.languages && navigator.languages[0]) || navigator.language || '').slice(0,2).toLowerCase(); if (RE.test(nv)) return nv;
          return 'en';
        }
        let L = initLang();
        let state = 'checking', maskedEmail = '', lastMsg = null;
        function M(k) { return (D[L] && D[L][k]) || D.it[k]; }
        function applyLang(l) {
          L = D[l] ? l : 'it';
          document.querySelectorAll('[data-i18n]').forEach(e => { const k = e.getAttribute('data-i18n'); if (D[L][k] || D.it[k]) e.textContent = M(k); });
          document.querySelectorAll('[data-i18n-attr]').forEach(e => { const p = e.getAttribute('data-i18n-attr').split(':'); e.setAttribute(p[0], M(p[1])); });
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === L));
          document.documentElement.lang = L; document.documentElement.dir = (L === 'ar' ? 'rtl' : 'ltr');
          try { localStorage.setItem('preferredLang', L); localStorage.setItem('lang', L); } catch (e) {}
          const dom = location.hostname.endsWith('.burgtv.com') || location.hostname === 'burgtv.com' ? '; domain=.burgtv.com' : '';
          document.cookie = 'burgtv_lang=' + L + '; max-age=31536000; path=/' + dom + '; SameSite=Lax';
          document.title = M('title') + ' - BurgTV';
          document.getElementById('toggle').textContent = document.getElementById('pw1').type === 'password' ? M('show') : M('hide');
          document.getElementById('desc').textContent = state === 'ready' ? M('desc').replace('{email}', maskedEmail) : state === 'checking' ? M('checking') : '';
          if (lastMsg) show(lastMsg[0], lastMsg[1]);
          meter();
        }
        function show(kind, key) {
          lastMsg = [kind, key];
          document.getElementById('errorMessage').classList.toggle('show', kind === 'error');
          document.getElementById('successMessage').classList.toggle('show', kind === 'success');
          document.getElementById(kind === 'error' ? 'errorText' : 'successText').textContent = M(key);
        }
        function hide() { lastMsg = null; document.getElementById('errorMessage').classList.remove('show'); document.getElementById('successMessage').classList.remove('show'); }
        function score(p) {
          if (!p) return 0;
          let s = 0;
          if (p.length >= 8) s++; if (p.length >= 12) s++; if (p.length >= 16) s++;
          if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++; if (/\d/.test(p)) s++; if (/[^A-Za-z0-9]/.test(p)) s++;
          if (new Set(p).size < 5) s = Math.min(s, 1);
          return s;
        }
        function meter() {
          const p = document.getElementById('pw1').value, s = score(p);
          const bar = document.getElementById('meterBar'), lab = document.getElementById('meterLabel');
          if (!p) { bar.style.width = '0'; lab.textContent = ''; return; }
          const lvl = s <= 2 ? ['weak', '33%', '#ef4444'] : s <= 4 ? ['medium', '66%', '#f59e0b'] : ['strong', '100%', '#10b981'];
          bar.style.width = lvl[1]; bar.style.background = lvl[2]; lab.textContent = M(lvl[0]);
        }
        // il token arriva nel frammento (#t=...): non viene mai inviato al server web ne' nei log
        const token = (location.hash.match(/[#&]t=([A-Za-z0-9_-]{43})/) || [])[1] || '';
        if (token) history.replaceState(null, '', location.pathname); // toglie il token dalla barra e dalla cronologia
        // link incollato in una scheda gia' aperta su questa pagina: si ricarica per leggere il nuovo token
        window.addEventListener('hashchange', () => { if (/[#&]t=/.test(location.hash)) location.reload(); });
        async function check() {
          if (!token) { state = 'invalid'; applyLang(L); show('error', 'invalid'); return; }
          try {
            const r = await fetch(`${API}/functions/v1/password-reset/status`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
            const d = await r.json();
            if (d.valid) { state = 'ready'; maskedEmail = d.email_masked || ''; document.getElementById('form').classList.remove('hidden'); setTimeout(() => document.getElementById('pw1').focus(), 50); }
            else { state = 'invalid'; show('error', 'invalid'); }
          } catch (e) { state = 'error'; show('error', 'conn'); }
          applyLang(L);
        }
        const REASON = { too_short: 'tooShort', too_long: 'tooLong', common: 'common', contains_email: 'containsEmail', repetitive: 'repetitive' };
        async function submit(ev) {
          ev.preventDefault(); hide();
          const p1 = document.getElementById('pw1').value, p2 = document.getElementById('pw2').value;
          if (p1.length < 8) return show('error', 'tooShort');
          if (new TextEncoder().encode(p1).length > 72) return show('error', 'tooLong');
          if (p1 !== p2) return show('error', 'mismatch');
          const btn = document.getElementById('btn'); btn.disabled = true;
          try {
            const r = await fetch(`${API}/functions/v1/password-reset/complete`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, new_password: p1 }) });
            const d = await r.json();
            if (d.ok) {
              document.getElementById('form').classList.add('hidden'); state = 'done';
              try { localStorage.removeItem('session_token'); } catch (e) {}
              show('success', 'ok'); applyLang(L);
              setTimeout(() => { location.href = 'login.html'; }, 4000);
              return;
            }
            if (d.code === 'weak_password') show('error', REASON[d.reason] || 'tooShort');
            else { document.getElementById('form').classList.add('hidden'); state = 'invalid'; show('error', 'invalid'); applyLang(L); }
          } catch (e) { show('error', 'conn'); }
          btn.disabled = false;
        }
        document.addEventListener('DOMContentLoaded', () => {
          document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));
          document.getElementById('pw1').addEventListener('input', meter);
          document.getElementById('toggle').addEventListener('click', () => {
            const t = document.getElementById('pw1').type === 'password' ? 'text' : 'password';
            document.getElementById('pw1').type = t; document.getElementById('pw2').type = t;
            document.getElementById('toggle').textContent = t === 'password' ? M('show') : M('hide');
          });
          document.getElementById('form').addEventListener('submit', submit);
          applyLang(L);
          check();
        });
    </script>
