            en:{title:"Limit reached: 5 TVs",body:"This license is already active on 5 TVs. To activate this TV, remove a device from your account first.",manage:"Manage your devices",deviceLabel:"Device",lastSeen:"last seen"},
            de:{title:"Limit erreicht: 5 TV-Geräte",body:"Diese Lizenz ist bereits auf 5 TV-Geräten aktiv. Um diesen Fernseher zu aktivieren, entferne zuerst ein Gerät aus deinem Konto.",manage:"Geräte verwalten",deviceLabel:"Gerät",lastSeen:"zuletzt aktiv"},
            es:{title:"Límite alcanzado: 5 televisores",body:"Esta licencia ya está activa en 5 televisores. Para activar este televisor, primero elimina un dispositivo de tu cuenta.",manage:"Administrar dispositivos",deviceLabel:"Dispositivo",lastSeen:"última actividad"},
            fr:{title:"Limite atteinte\u00a0: 5 TV",body:"Cette licence est déjà active sur 5 TV. Pour activer cette TV, supprimez d'abord un appareil de votre compte.",manage:"Gérer vos appareils",deviceLabel:"Appareil",lastSeen:"dernière activité"},
            pt:{title:"Limite atingido: 5 TVs",body:"Esta licença já está ativa em 5 TVs. Para ativar esta TV, primeiro remova um dispositivo da sua conta.",manage:"Gerenciar seus dispositivos",deviceLabel:"Dispositivo",lastSeen:"último uso"},
            tr:{title:"Sınıra ulaşıldı: 5 TV",body:"Bu lisans zaten 5 TV'de etkin. Bu TV'yi etkinleştirmek için önce hesabından bir cihazı kaldır.",manage:"Cihazlarını yönet",deviceLabel:"Cihaz",lastSeen:"son kullanım"},
            nl:{title:"Limiet bereikt: 5 tv's",body:"Deze licentie is al actief op 5 tv's. Om deze tv te activeren, verwijder je eerst een apparaat uit je account.",manage:"Je apparaten beheren",deviceLabel:"Apparaat",lastSeen:"laatst gebruikt"},
            pl:{title:"Osiągnięto limit: 5 telewizorów",body:"Ta licencja jest już aktywna na 5 telewizorach. Aby aktywować ten telewizor, najpierw usuń urządzenie ze swojego konta.",manage:"Zarządzaj swoimi urządzeniami",deviceLabel:"Urządzenie",lastSeen:"ostatnio używane"},
            ru:{title:"Достигнут лимит: 5 телевизоров",body:"Эта лицензия уже активна на 5 телевизорах. Чтобы активировать этот телевизор, сначала удалите одно устройство из своего аккаунта.",manage:"Управление устройствами",deviceLabel:"Устройство",lastSeen:"последнее использование"},
            ar:{title:"تم الوصول للحد الأقصى: 5 أجهزة تلفزيون",body:"هذا الترخيص نشط بالفعل على 5 أجهزة تلفزيون. لتفعيل هذا التلفزيون أزل أولاً جهازًا من حسابك.",manage:"إدارة أجهزتك",deviceLabel:"جهاز",lastSeen:"آخر استخدام"}
        };
        function showDeviceLimitError(data){
            const t=DEVICE_LIMIT_I18N[currentLang]||DEVICE_LIMIT_I18N.it;
            const el=document.getElementById('errorMessage');
            const devs=Array.isArray(data&&data.devices)?data.devices:[];
            const list=devs.map((d,i)=>{
                const name=d.device_name||(t.deviceLabel+' '+(i+1));
                const date=d.last_active?new Date(d.last_active).toLocaleDateString():'';
                const safeName=name.replace(/[<>]/g,'');
                return `<li>${safeName}${date?` <span style="opacity:0.6">— ${t.lastSeen} ${date}</span>`:''}</li>`;
            }).join('');
            el.innerHTML=`<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div><strong>${t.title}</strong><br><span>${t.body}</span>${list?`<ul style="margin-top:10px;padding-left:20px;font-size:14px;">${list}</ul>`:''}<a href="/login.html" style="display:inline-block;margin-top:12px;color:#d85aa3;text-decoration:underline;">${t.manage} →</a></div>`;
            el.classList.add('show');
            el.style.alignItems='flex-start';
        }

        function _initLang(){
            const RE=/^(it|en|de|es|fr|pt|tr|nl|pl|ru|ar)$/;
            const m=document.cookie.match(/burgtv_lang=([^;]+)/);
            if(m && RE.test(m[1])) return m[1];
            const sv=localStorage.getItem('preferredLanguage')||localStorage.getItem('preferredLang')||localStorage.getItem('lang'); if(sv && RE.test(sv)) return sv;
            const nv=((navigator.languages&&navigator.languages[0])||navigator.language||'').slice(0,2).toLowerCase(); if(RE.test(nv)) return nv;
            return 'en';
        }
        let currentLang=_initLang(),selectedPlan='annual';
        const urlParams=new URLSearchParams(window.location.search),tvCode=urlParams.get('code'),planParam=urlParams.get('plan');
        function changeLanguage(l){
            if(!translations[l])l='it';
            currentLang=l;
            localStorage.setItem('preferredLanguage',l);
            localStorage.setItem('preferredLang',l);
            localStorage.setItem('lang',l);
            const dom=location.hostname.endsWith('.burgtv.com')||location.hostname==='burgtv.com'?'; domain=.burgtv.com':'';
            document.cookie='burgtv_lang='+l+'; max-age=31536000; path=/'+dom+'; SameSite=Lax';
            document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
            const b=document.getElementById('btn-'+l);if(b)b.classList.add('active');
            document.documentElement.dir=(l==='ar'?'rtl':'ltr');updateTexts();
        }
        function updateTexts(){const t=translations[currentLang];document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.getAttribute('data-i18n');if(t[k])e.textContent=t[k]});document.querySelectorAll('[data-i18n-html]').forEach(e=>{const k=e.getAttribute('data-i18n-html');if(t[k])e.innerHTML=t[k]});document.querySelectorAll('[data-i18n-attr]').forEach(e=>{const p=e.getAttribute('data-i18n-attr').split(':');if(t[p[1]])e.setAttribute(p[0],t[p[1]])});document.documentElement.lang=currentLang;if(t.pageTitle)document.title=t.pageTitle;const pb={it:'Popolare',en:'Popular',de:'Beliebt',es:'Popular',fr:'Populaire',pt:'Popular',tr:'Popüler',nl:'Populair',pl:'Popularny',ru:'Популярный',ar:'الأكثر شيوعًا'};const pc=document.getElementById('planPermanent');if(pc)pc.setAttribute('data-badge',pb[currentLang]||pb.en)}
        function selectPlan(p){selectedPlan=p;const r=document.querySelector('input[name="plan"][value="'+p+'"]');if(r&&!r.checked)r.checked=true;document.getElementById('planAnnual').classList.toggle('selected',p==='annual');document.getElementById('planPermanent').classList.toggle('selected',p==='permanent')}
        document.querySelectorAll('input[name="plan"]').forEach(r=>r.addEventListener('change',()=>{if(r.checked)selectPlan(r.value)}));
        function togglePassword(i,ic,btn){const inp=document.getElementById(i),icon=document.getElementById(ic);if(btn)btn.setAttribute('aria-pressed',inp.type==='password'?'true':'false');if(inp.type==='password'){inp.type='text';icon.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'}else{inp.type='password';icon.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'}}
        // Turnstile: caricato al primo uso del modulo (assets/js/bv-turnstile.js), token inviato a /register
        function showError(m,focusId){const box=document.getElementById('errorMessage');box.classList.add('show');document.getElementById('errorText').textContent=m;if(focusId){const f=document.getElementById(focusId);if(f){f.setAttribute('aria-invalid','true');f.focus()}}}
        function hideError(){document.getElementById('errorMessage').classList.remove('show');document.getElementById('errorText').textContent='';document.querySelectorAll('[aria-invalid]').forEach(e=>e.removeAttribute('aria-invalid'))}
        function setLoading(l){const b=document.getElementById('payBtn'),t=document.getElementById('btnText');b.disabled=l;t.innerHTML=l?'<span class="spinner"></span>':translations[currentLang].payBtn}
        async function handleSubmit(e){
            e.preventDefault();
            hideError();
            const email=document.getElementById('email').value.trim();
            const password=document.getElementById('password').value;
            const confirmPassword=document.getElementById('confirmPassword').value;
            const t=translations[currentLang];

            // 🔧 v1.1.30: TV code is OPTIONAL. Three sources, in priority order:
            //   1) ?code= URL parameter (set by the TV app when generating QR)
            //   2) Manually typed in tvCodeManual input
            //   3) None (registered directly from the website / Google Play marketing)
            // If typed manually we still validate the format to avoid silent typos,
            // but an empty manual field is perfectly accepted.
            let activeCode = tvCode;
            const manualEl = document.getElementById('tvCodeManual');
            if (!activeCode && manualEl) {
                const typed = (manualEl.value || '').trim().toUpperCase();
                if (typed) {
                    if (!/^TV-[A-Z0-9]{4}$/.test(typed)) {
                        showError(t.errors.invalidCode || 'Codice TV non valido (formato TV-XXXX)','tvCodeManual');
                        return;
                    }
                    activeCode = typed;
                }
                // empty typed → activeCode stays null, signup-style flow
            }

            if(!email||!email.includes('@')){showError(t.errors.email,'email');return}
            if(password.length<8){showError(t.errors.password,'password');return}
            if(password!==confirmPassword){showError(t.errors.passwordMatch,'confirmPassword');return}

            setLoading(true);

            // Token anti-bot: se il widget non e' ancora pronto lo aspettiamo (max 20 s)
            const turnstileToken = window.BVTS ? await BVTS.token() : null;
            if(!turnstileToken){showError(t.errors.verify);setLoading(false);return}

            try{
                // 1. Prima crea l'account — passa activation_code solo se presente
                const regBody = {email, password, turnstile_token: turnstileToken, source: 'web'};
                if (activeCode) regBody.activation_code = activeCode;
                const regRes = await fetch(`${SUPABASE_URL}/functions/v1/register`,{
                    method:'POST',
                    headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_ANON_KEY}`},
                    body:JSON.stringify(regBody)
                });
                const regData = await regRes.json();
                if (window.BVTS) BVTS.consume(); // il token vale una sola volta

                if(!regRes.ok){
                    if(regData.error_code && String(regData.error_code).indexOf('turnstile')===0){
                        showError(t.errors.verify);
                    } else if(regData.error && regData.error.includes('esiste già')){
                        showError(t.errors.emailExists || 'Un account con questa email esiste già');
                    } else {
                        throw new Error(regData.error || 'Registration failed');
                    }
                    setLoading(false);
                    return;
                }

                // Salva sessione
                localStorage.setItem('session_token', regData.session_token);
                localStorage.setItem('user_email', email);
                localStorage.setItem('user_id', regData.user.id);

                // 2. Vai al checkout Stripe — code solo se presente
                const checkoutBody = {email, plan:selectedPlan};
                if (activeCode) checkoutBody.code = activeCode;
                const r=await fetch(`${SUPABASE_URL}/functions/v1/create-checkout-session`,{
                    method:'POST',
                    headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_ANON_KEY}`},
                    body:JSON.stringify(checkoutBody)
                });
                const d=await r.json();

                // 🔧 v1.1.12: 5-device limit (HTTP 409) — render the multilingual prompt
                // with the device list so the user can act on it (remove one + retry).
                if(r.status===409 && d && d.error_code==='device_limit_exceeded'){
                    showDeviceLimitError(d);
                    setLoading(false);
                    return;
                }
                if(d.already_licensed){
                    // 🔧 v1.1.30: if there's no TV code (signup-style flow), redirect to
                    // account dashboard. Otherwise keep the legacy /attiva/success.html
                    // page that knows how to render the device-already-active state.
                    if (!activeCode) {
                        window.location.href = 'account.html?welcome=existing';
                        return;
                    }
                    const slotParam=d.slot?`&slot=${encodeURIComponent(d.slot)}`:'';
                    const statusParam=d.status?`&s=${encodeURIComponent(d.status)}`:'';
                    window.location.href=`attiva/success.html?already=true${slotParam}${statusParam}`;
                    return;
                }
                // 🔧 v1.1.30: handle specific error codes from the backend before
                // falling through to the generic catch.
                if (!r.ok) {
                    const backendMsg = (d.error || '').toLowerCase();
                    if (backendMsg.includes('activation code') || backendMsg.includes('codice')) {
                        // Invalid or expired TV code (format was OK but session doesn't exist)
                        showError(t.errors.invalidOrExpiredCode || 'Codice TV non valido o scaduto. Genera un nuovo codice dalla TV oppure registrati senza codice.');
                        setLoading(false);
                        return;
                    }
                    showError(d.error || t.errors.generic);
                    setLoading(false);
                    return;
                }
                if(d.checkout_url)window.location.href=d.checkout_url;
                else throw new Error('No checkout URL');
            }catch(err){
                console.error('Error:',err);
                if (window.BVTS) BVTS.consume();
                showError(translations[currentLang].errors.generic);
                setLoading(false);
            }
        }
        document.addEventListener('DOMContentLoaded',function(){
            changeLanguage(currentLang);
            if(tvCode){
                document.getElementById('tvCode').textContent=tvCode;
                document.getElementById('tvCodeBox').style.display='flex';
            } else {
                // 🔧 v1.1.12: no ?code= in URL → let the user type it manually.
                document.getElementById('tvCodeManualBox').style.display='block';
            }
            if(planParam==='permanent')selectPlan('permanent');
            else if(planParam==='annual')selectPlan('annual');
        });
    </script>
